<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Панель управления Системой</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #181e23; 
            color: #ecf0f1; 
            margin: 0; 
            padding: 15px; 
        }
        h2 { text-align: center; color: #3498db; margin-bottom: 15px; }

        /* Главный селектор режимов (Верхний блок) */
        .db-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .db-btn {
            background: #11161a;
            border: 2px solid #3498db;
            color: #3498db;
            padding: 10px 20px;
            font-size: 0.95em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .db-btn.active {
            background: #3498db;
            color: #fff;
            box-shadow: 0 0 12px rgba(52, 152, 219, 0.5);
        }

        /* Особые стили для доп. кнопок верхнего меню */
        .db-btn.log-btn-top { border-color: #f1c40f; color: #f1c40f; }
        .db-btn.log-btn-top.active { background: #f1c40f; color: #181e23; box-shadow: 0 0 12px rgba(241, 196, 15, 0.5); }
        
        .db-btn.chart-btn-top { border-color: #2ecc71; color: #2ecc71; }
        .db-btn.chart-btn-top.active { background: #2ecc71; color: #181e23; box-shadow: 0 0 12px rgba(46, 204, 113, 0.5); }

        /* Вкладки параметров */
        .tabs { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 15px; }
        .tab-btn { 
            background: #2c3e50; border: none; color: #bdc3c7; padding: 8px 14px; 
            cursor: pointer; border-radius: 6px; font-weight: bold; transition: 0.2s; 
        }
        .tab-btn:hover { background: #34495e; color: #fff; }
        .tab-btn.active { background: #2980b9; color: #fff; }

        /* Контейнеры и карточки */
        .tab-content { display: none; }
        .tab-content.active { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }

        .card { 
            background: #242c35; padding: 10px; border-radius: 8px; 
            border-left: 4px solid #3498db; box-shadow: 0 2px 6px rgba(0,0,0,0.3); 
            user-select: none;
        }
        .card-title { font-size: 0.75em; color: #8899a6; text-transform: uppercase; word-break: break-all; }
        .card-value { font-size: 1.2em; font-weight: bold; color: #f1c40f; margin-top: 4px; }

        /* Светодиоды и тумблеры */
        .bool-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)) !important; }
        .led-card { 
            display: flex; align-items: center; background: #242c35; 
            padding: 8px 12px; border-radius: 8px; gap: 10px; user-select: none;
        }
        .led { width: 14px; height: 14px; border-radius: 50%; background: #4a5568; flex-shrink: 0; transition: background 0.2s, box-shadow 0.2s; }
        .led.on { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        .led-name { font-size: 0.85em; color: #d2d6dc; word-break: break-all; }

        /* Стили редактирования уставок */
        .card.editable, .led-card.editable { cursor: pointer; transition: transform 0.1s, border-color 0.2s; }
        .card.editable:hover, .led-card.editable:hover { border-left-color: #f1c40f; transform: translateY(-2px); }

        /* --- СТИЛИ ЖУРНАЛА СОБЫТИЙ --- */
        .log-container {
            grid-column: 1 / -1;
            background: #242c35;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .log-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .log-btn { background: #2c3e50; border: 1px solid #3498db; color: #ecf0f1; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .log-btn:hover { background: #3498db; }
        .log-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .log-table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        .log-table th { background: #181e23; color: #3498db; text-align: left; padding: 10px; border-bottom: 2px solid #2c3e50; }
        .log-table td { padding: 8px 10px; border-bottom: 1px solid #2c3e50; }
        .log-table tr:hover { background: #2c3e50; }

        .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; display: inline-block; }
        .badge-info { background: #2980b9; color: #fff; }
        .badge-warn { background: #e67e22; color: #fff; }
        .badge-alarm { background: #e74c3c; color: #fff; }

        /* --- СТИЛИ ОСЦИЛЛОГРАФА И ПАНЕЛИ УПРАВЛЕНИЯ ГРАФИКОМ --- */
        .chart-legend { display: flex; gap: 20px; justify-content: center; margin-bottom: 10px; font-weight: bold; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-color { width: 14px; height: 14px; border-radius: 3px; }
        
        .chart-controls {
            display: flex;
            gap: 15px;
            justify-content: flex-start;
            align-items: center;
            background: #181e23;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            border: 1px solid #2c3e50;
            flex-wrap: wrap;
            font-size: 0.9em;
        }
        .chart-controls select, .chart-controls input {
            background: #2c3e50;
            border: 1px solid #3498db;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .chart-controls input[type="number"] { width: 65px; text-align: center; }

        canvas { width: 100%; height: 350px; background: #181e23; border-radius: 6px; border: 1px solid #2c3e50; }
    </style>
</head>
<body>

    <h2>Система Мониторинга и Управления</h2>

    <!-- Верхняя панель переключения режимов -->
    <div class="db-selector">
        <button class="db-btn active" onclick="switchTopMode('main', this)">Оперативные данные (DBMain)</button>
        <button class="db-btn" onclick="switchTopMode('params', this)">Уставки / Настройки (DBParameters)</button>
        <button class="db-btn chart-btn-top" onclick="switchTopMode('charts', this)">📈 Осциллограф / График</button>
        <button class="db-btn log-btn-top" onclick="switchTopMode('logs', this)">📋 Журнал событий</button>
    </div>

    <!-- Подвкладки типов данных -->
    <div class="tabs" id="sub-tabs-container">
        <button class="tab-btn active" onclick="openTab('tab1', this)">Float 1-50</button>
        <button class="tab-btn" onclick="openTab('tab2', this)">Float 51-100</button>
        <button class="tab-btn" onclick="openTab('tab3', this)">Int32 1-50</button>
        <button class="tab-btn" onclick="openTab('tab4', this)">UInt32 1-50</button>
        <button class="tab-btn" onclick="openTab('tab5', this)">Bool 1-32</button>
        <button class="tab-btn" onclick="openTab('tab6', this)">Bool 33-64</button>
        <button class="tab-btn" onclick="openTab('tab7', this)">Bool 65-96</button>
    </div>

    <!-- Контент окон (БД и Параметры) -->
    <div id="tab1" class="tab-content active"></div>
    <div id="tab2" class="tab-content"></div>
    <div id="tab3" class="tab-content"></div>
    <div id="tab4" class="tab-content"></div>
    <div id="tab5" class="tab-content bool-grid"></div>
    <div id="tab6" class="tab-content bool-grid"></div>
    <div id="tab7" class="tab-content bool-grid"></div>
    
    <!-- Контент Журнала Событий -->
    <div id="tab8" class="tab-content" style="grid-template-columns: 1fr;">
        <div class="log-container">
            <div class="log-toolbar">
                <button class="log-btn" id="btn-log-prev" onclick="changeLogPage(-1)">◀ Назад</button>
                <span id="log-page-info" style="font-weight: bold; color: #f1c40f;">Стр. 1</span>
                <button class="log-btn" id="btn-log-next" onclick="changeLogPage(1)">Вперед ▶</button>
                <button class="log-btn" onclick="triggerImmediateUpdate()" style="margin-left: 10px;">🔄 Обновить</button>
                <button class="log-btn" onclick="window.location.href='/api/logs_export'" style="border-color: #2ecc71; color: #2ecc71;">📥 Скачать CSV</button>
                <span id="log-total-info" style="margin-left: auto; color: #8899a6; font-size: 0.9em;">Записей: 0</span>
            </div>
            <table class="log-table">
                <thead>
                    <tr>
                        <th>Время (Таймштамп)</th>
                        <th>Код события</th>
                        <th>Уровень</th>
                        <th>Значение</th>
                        <th>Param ID</th>
                    </tr>
                </thead>
                <tbody id="log-table-body">
                    <tr><td colspan="5" style="text-align: center; color: #8899a6;">Загрузка данных...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Контент Осциллографа -->
    <div id="tab9" class="tab-content" style="grid-template-columns: 1fr;">
        <div class="log-container">
            <!-- Легенда сигналов -->
            <div class="chart-legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #3498db;"></div>
                    <span>Useti: <span id="val-useti" style="color: #3498db;">--</span> В</span>
                </div>
                <div class="legend-item" style="margin-left: 20px;">
                    <div class="legend-color" style="background: #f1c40f;"></div>
                    <span>Iakb: <span id="val-iakb" style="color: #f1c40f;">--</span> А</span>
                </div>
            </div>

            <!-- Панель настроек осциллографа -->
            <div class="chart-controls">
                <label>История:
                    <select id="chart-samples-select" onchange="changeChartSamples(this.value)">
                        <option value="30">30 сэмплов (9 сек)</option>
                        <option value="60" selected>60 сэмплов (18 сек)</option>
                        <option value="120">120 сэмплов (36 сек)</option>
                        <option value="300">300 сэмплов (1.5 мин)</option>
                        <option value="600">600 сэмплов (3 мин)</option>
                    </select>
                </label>

                <label style="margin-left: 10px;">Масштаб:
                    <select id="chart-scale-select" onchange="changeChartScaleMode(this.value)">
                        <option value="auto" selected>Автоматический</option>
                        <option value="fixed">Заданный (Фиксированный)</option>
                    </select>
                </label>

                <!-- Ввод рамок при фиксированном масштабе -->
                <div id="fixed-scale-inputs" style="display: none; gap: 10px; margin-left: 10px; align-items: center;">
                    <label>Uсети: <input type="number" id="useti-min" value="-300" onchange="drawCanvasChart()"> .. <input type="number" id="useti-max" value="300" onchange="drawCanvasChart()"> В</label>
                    <label style="margin-left: 10px;">Iакб: <input type="number" id="iakb-min" value="-100" onchange="drawCanvasChart()"> .. <input type="number" id="iakb-max" value="100" onchange="drawCanvasChart()"> А</label>
                </div>

                <!-- Кнопка скачивания текущей истории сэмплов -->
                <button class="log-btn" onclick="downloadChartCSV()" style="border-color: #2ecc71; color: #2ecc71; margin-left: auto;">
                    📥 Скачать график (CSV)
                </button>
            </div>

            <canvas id="rtChart"></canvas>
        </div>
    </div>

    <script>
        // --- НАСТРОЙКИ ОПРОСА ---
        const POLL_INTERVAL_MS = 300;  // Частота обновления UI (в миллисекундах)
        const ERROR_RETRY_MS   = 2000; // Пауза при ошибке сети
        
        let currentTopMode = 'main'; // 'main', 'params', 'logs' или 'charts'
        let currentDB = 'main';      // 'main' или 'params'
        let currentSubTab = 'tab1';  // Текущая активная подвкладка (tab1..tab7)
        let activeGroup = 'f50';     // Активная группа для опроса по Modbus
        let lastParamsMasks = { b32: 0, b64: 0, b96: 0 }; // Кэш битовых масок уставок

        // Переменные состояния для пагинации журнала событий
        let logOffset = 0;
        const LOG_LIMIT = 12;
        let logTotalInRing = 0;

        // --- ДИНАМИЧЕСКИЕ НАСТРОЙКИ ГРАФИКА ---
        let maxChartPoints = 60;   // Число сэмплов по умолчанию (60)
        let chartScaleMode = 'auto'; // 'auto' или 'fixed'
        let chartHistory = { useti: [], iakb: [] };

        // Контроллеры фоновых запросов
        let activeFetchController = null;
        let updateTimer = null;

        // Карта соответствия ID вкладок именам групп Modbus
        const tabGroupMap = {
            tab1: 'f50', tab2: 'f100', tab3: 'i50', tab4: 'u50',
            tab5: 'b32', tab6: 'b64', tab7: 'b96', tab8: 'logs', tab9: 'f50'
        };

        // Словари имен для DBMain
        const dbMainNames = {
            f50: ["UsetiV", "Useti", "IakbA", "Iakb", "Rezerv1U", "Rezerv1", "Rezerv2U", "Rezerv2", "Rezerv3U", "Rezerv3", "Rezerv4U", "Rezerv4", "GenFreq", "GenFreqHz", "Idпорог", "Itint", "FreqGenABHz", "FreqGenBCHz", "FreqGenCAHz", "SpeedCar", "ControlPhazGenGist", "Alfa_ref", "Alfa", "Idref2", "RTout2", "Idelta2", "IntChRT2", "ZiTout1", "Idref1", "RTout1", "Idelta1", "IntChRT1", "RNref", "RNout", "Ndelta", "IntChRN", "ZiNout", "ZiNTiStop", "TimerA", "TimerB", "TimerC", "Ud_ref", "IakbRef", "IgenRef", "Iseti", "RefIovg", "fval47", "fval48", "fval49", "fval50"],
            f100: Array.from({length:50}, (_, i) => `fval${i+51}`),
            i50: Array.from({length:50}, (_, i) => i === 0 ? "phaseSum" : `ival${i+1}`),
            u50: Array.from({length:50}, (_, i) => `uval${i+1}`),
            b32: ["Kn380V_Vtkl_DIxor", "Kn380V_Otkl_DIxor", "KrishkaVidkrita_DIxor", "DistanVidkl380V_DIxor", "QFVvod_DIxor", "QFVvodAvarStan_DIxor", "Rezerv1_DIxor", "Rezerv2_DIxor", "Rezerv3_DIxor", "Rezerv4_DIxor", "Rezerv5_DIxor", "Rezerv6_DIxor", "Rezerv7_DIxor", "i380V_Podano_DOxor", "i380V_Znyato_DOxor", "Merezha380vFault_DOxor", "GeneratorFault_DOxor", "i380V_Vvod_DOxor", "BlockDoor_DOxor", "Rezerv1_DOxor", "Rezerv2_DOxor", "Rezerv3_DOxor", "Rezerv4_DOxor", "Rezerv5_DOxor", "Rezerv6_DOxor", "Rezerv7_DOxor", "Rezerv8_DOxor", "Reset", "DistanVidkl380V", "QFVvodAvarStan", "i380V_Vvod", "FazaA1Loss"],
            b64: ["FazaB1Loss", "FazaC1Loss", "ABC380ok", "FazaLossInWork", "Iakb_TimemaxMem", "IakbmaxMem", "ReadyVkl", "ReadyRun", "ReadyRef", "Run", "Fault", "Gotov", "Alarm", "RectVkluchen", "BlockRect", "GenAloss", "GenBloss", "GenCloss", "GenAsboi", "GenBsboi", "GenCsboi", "FaultGenerator", "BlockCarDoors", "BlockSifu", "TM", "EnableSifu", "BlokDeleyTimeSifu", "ShuntReg", "ShuntRT2", "ShuntZiT1", "ShuntRT1", "ShuntZiT2"],
            b96: ["ShuntRN", "ShuntZiN", "UdmaxMem", "Sled", "EStopMem", "EnableSifuOld", "PulseStage1", "PulseStage2", "PulseStage3", "PulseStage4", "PulseStage5", "PulseStage6", "Save_to_Flash", "Read_from_Flash", "bit79", "bit80", "bit81", "bit82", "bit83", "bit84", "bit85", "bit86", "bit87", "bit88", "bit89", "bit90", "bit91", "bit92", "bit93", "bit94", "bit95", "bit96"]
        };

        // Словари имен для DBParameters
        const dbParamsNames = {
            f50: ["P1_1", "P1_2", "P2_1", "P4_5", "P4_6", "P5_2", "P5_3", "P5_4", "P5_5", "P5_6", "P5_7", "P6_2", "P6_3", "P6_4", "P6_5", "P6_6", "P6_7", "P20_1", "P20_2", "P20_3", "P20_4", "P20_5", "P20_6", "P20_7", "P20_8", "P20_9", "P20_10", "P20_11", "P20_12", "P20_13", "P20_14", "P20_15", "P20_16", "P20_17", "P20_18", "P21_2", "P21_3", "P21_5", "P21_6", "P21_8", "P21_9", "P21_11", "P21_12", "P21_14", "P21_15", "P21_17", "P21_18", "P60_1", "P60_2", "P61_1"],
            f100: ["P31_1", "P31_2", "P31_3", "P32_1", "P32_2", "P32_3", "P32_4", "P33_1", "P33_2", "P33_3", "P33_4", "P34_1", "P34_2", "P34_3", "P34_4", "P34_5", "P34_6", "P34_7", "P34_8", "P50_1", "P50_2", "P50_3", "P50_4", "P50_5", "P50_6", "P50_7", "P50_8", "P50_9", "P50_10", "P61_2", "P80_1", "P80_2", "P80_3", "P80_4", "P80_5", "P81_1", "P81_2", "P81_3", "P81_4", "P81_5", "fP41", "fP42", "fP43", "fP44", "fP45", "fP46", "fP47", "fP48", "fP49", "fP50"],
            i50: Array.from({length:50}, (_, i) => `iset${i+1}`),
            u50: ["P10_1", "P10_2", "P10_3", "P10_4", "P10_5", "P10_6", "P10_7", "P10_8", "P10_9", "P10_10", "P10_11", "P10_12", "P10_13", ...Array.from({length:37}, (_, i) => `uset${i+14}`)],
            b32: ["P3_1", "P3_2", "P3_3", "P4_1", "P4_2", "P4_3", "P4_4", "P5_1", "P5_8", "P6_1", "P11_1", "P11_2", "P11_3", "P11_4", "P11_5", "P11_6", "P11_7", "P11_8", "P11_9", "P11_10", "P11_11", "P11_12", "P11_13", "P11_14", "P11_15", "P11_16", "P30_1", "P30_2", "P30_4", "P30_5", "P30_6", "P30_7"],
            b64: ["P70_1", "P70_2", "P70_3", "P70_4", "P70_5", "P70_6", "P70_7", "P70_8", "P70_9", "P70_10", "P70_11", "P70_12", "P70_13", "P70_14", "P21_1", "P21_4", "P21_7", "P21_10", "P21_13", "P21_16", "P30_3", ...Array.from({length:11}, (_, i) => `bit${i+22}`)],
            b96: Array.from({length:32}, (_, i) => `bit${i+1}`)
        };

        // Переключение верхних режимов
        function switchTopMode(mode, btn) {
            if (currentTopMode === mode) return;
            currentTopMode = mode;
            
            document.querySelectorAll('.db-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const subTabsContainer = document.getElementById('sub-tabs-container');

            if (mode === 'logs') {
                subTabsContainer.style.display = 'none';
                activeGroup = 'logs';
                showTabContent('tab8');
            } else if (mode === 'charts') {
                subTabsContainer.style.display = 'none';
                activeGroup = 'f50';
                currentDB = 'main';
                showTabContent('tab9');
            } else {
                subTabsContainer.style.display = 'flex';
                currentDB = mode;
                activeGroup = tabGroupMap[currentSubTab];
                showTabContent(currentSubTab);
                renderDOM();
            }

            triggerImmediateUpdate();
        }

        function showTabContent(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        function openTab(tabId, btn) {
            currentSubTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            showTabContent(tabId);

            activeGroup = tabGroupMap[tabId];
            triggerImmediateUpdate();
        }

        function renderDOM() {
            const names = (currentDB === 'main') ? dbMainNames : dbParamsNames;
            createCards('tab1', names.f50);
            createCards('tab2', names.f100);
            createCards('tab3', names.i50);
            createCards('tab4', names.u50);
            createLeds('tab5', names.b32);
            createLeds('tab6', names.b64);
            createLeds('tab7', names.b96);
        }

        function createCards(tabId, names) {
            const group = tabGroupMap[tabId];
            document.getElementById(tabId).innerHTML = names.map((name, i) => `
                <div class="card ${currentDB === 'params' ? 'editable' : ''}" 
                     onclick="editParam('${group}', ${i}, '${name}')">
                    <div class="card-title">${name}</div>
                    <div class="card-value" id="${tabId}_${i}">--</div>
                </div>
            `).join('');
        }

        function createLeds(tabId, names) {
            const group = tabGroupMap[tabId];
            document.getElementById(tabId).innerHTML = names.map((name, i) => `
                <div class="led-card ${currentDB === 'params' ? 'editable' : ''}" 
                     onclick="toggleParamBit('${group}', ${i}, '${name}')">
                    <div class="led" id="${tabId}_${i}"></div>
                    <div class="led-name">${name}</div>
                </div>
            `).join('');
        }

        function triggerImmediateUpdate() {
            if (activeFetchController) activeFetchController.abort();
            clearTimeout(updateTimer);
            updateData();
        }

        // Главный опрос данных
        function updateData() {
            if (activeFetchController) activeFetchController.abort();
            activeFetchController = new AbortController();

            const reqDB = currentDB;
            const reqGroup = activeGroup;

            // --- ВЕТКА 1: Чтение Журнала Событий (/api/logs) ---
            if (reqGroup === 'logs') {
                fetch(`/api/logs?offset=${logOffset}&limit=${LOG_LIMIT}`, { signal: activeFetchController.signal })
                    .then(res => res.json())
                    .then(data => {
                        if (activeGroup !== 'logs') return;
                        logTotalInRing = data.total || 0;
                        renderLogTable(data.logs || []);
                        updateLogPaginationControls();
                        updateTimer = setTimeout(updateData, 2000);
                    })
                    .catch(err => {
                        if (err.name === 'AbortError') return;
                        updateTimer = setTimeout(updateData, ERROR_RETRY_MS);
                    });
                return;
            }

            // --- ВЕТКА 2: Чтение регистров (DBMain / DBParameters / Осциллограф) ---
            const baseUrl = (reqDB === 'main') ? '/api/data_all' : '/api/params_all';
            fetch(`${baseUrl}?group=${reqGroup}`, { signal: activeFetchController.signal })
                .then(res => res.json())
                .then(data => {
                    if (reqDB !== currentDB || reqGroup !== activeGroup) return;

                    const val = data[reqGroup];

                    if (val !== undefined) {
                        // КРИТИЧЕСКАЯ ПРОВЕРКА: Наполняем буфер графика ТОЛЬКО из DBMain!
                        if (reqDB === 'main' && reqGroup === 'f50') {
                            const uSetiVal = val[1]; // Useti (индекс 1)
                            const iAkbVal  = val[3]; // Iakb (индекс 3)

                            pushChartData(uSetiVal, iAkbVal);

                            if (currentTopMode === 'charts') {
                                document.getElementById('val-useti').innerText = uSetiVal.toFixed(2);
                                document.getElementById('val-iakb').innerText  = iAkbVal.toFixed(2);
                                drawCanvasChart();
                            }
                        }

                        // Отрисовка значений в карточках
                        const tabId = Object.keys(tabGroupMap).find(key => tabGroupMap[key] === reqGroup);
                        if (['f50', 'f100'].includes(reqGroup)) {
                            val.forEach((v, i) => { const el = document.getElementById(`${tabId}_${i}`); if(el) el.innerText = v.toFixed(2); });
                        } else if (['i50', 'u50'].includes(reqGroup)) {
                            val.forEach((v, i) => { const el = document.getElementById(`${tabId}_${i}`); if(el) el.innerText = v; });
                        } else if (['b32', 'b64', 'b96'].includes(reqGroup)) {
                            updateBitGroup(tabId, val);
                            if (currentDB === 'params') lastParamsMasks[reqGroup] = val;
                        }
                    }

                    updateTimer = setTimeout(updateData, POLL_INTERVAL_MS);
                })
                .catch(err => {
                    if (err.name === 'AbortError') return;
                    updateTimer = setTimeout(updateData, ERROR_RETRY_MS);
                });
        }

        function updateBitGroup(tabId, bitmask) {
            for (let i = 0; i < 32; i++) {
                const isSet = (bitmask & (1 << i)) !== 0;
                const led = document.getElementById(`${tabId}_${i}`);
                if (led) {
                    if (isSet) led.classList.add('on');
                    else led.classList.remove('on');
                }
            }
        }

        // --- ЛОГИКА И ИНТЕРАКТИВ ГРАФИКОВ (CANVAS) ---

        function changeChartSamples(val) {
            maxChartPoints = parseInt(val, 10);
            while (chartHistory.useti.length > maxChartPoints) chartHistory.useti.shift();
            while (chartHistory.iakb.length > maxChartPoints) chartHistory.iakb.shift();
            drawCanvasChart();
        }

        function changeChartScaleMode(val) {
            chartScaleMode = val;
            const inputsDiv = document.getElementById('fixed-scale-inputs');
            inputsDiv.style.display = (val === 'fixed') ? 'flex' : 'none';
            drawCanvasChart();
        }

        function pushChartData(useti, iakb) {
            chartHistory.useti.push(useti);
            chartHistory.iakb.push(iakb);
            while (chartHistory.useti.length > maxChartPoints) chartHistory.useti.shift();
            while (chartHistory.iakb.length > maxChartPoints) chartHistory.iakb.shift();
        }

        function downloadChartCSV() {
            if (!chartHistory.useti.length) {
                alert("Буфер графика пуст!");
                return;
            }

            let csv = "N;Time_Offset_s;Useti_V;Iakb_A\r\n";
            const intervalSec = POLL_INTERVAL_MS / 1000;
            const total = chartHistory.useti.length;

            for (let i = 0; i < total; i++) {
                let timeOffset = ((i - total + 1) * intervalSec).toFixed(1);
                let u = (chartHistory.useti[i] !== undefined) ? chartHistory.useti[i].toFixed(2) : "";
                let iAkb = (chartHistory.iakb[i] !== undefined) ? chartHistory.iakb[i].toFixed(2) : "";

                csv += `${i + 1};${timeOffset};${u};${iAkb}\r\n`;
            }

            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2,'0') + '-' + 
                            String(now.getMinutes()).padStart(2,'0') + '-' + 
                            String(now.getSeconds()).padStart(2,'0');

            a.href = url;
            a.download = `chart_samples_${timeStr}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function drawCanvasChart() {
            const canvas = document.getElementById('rtChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;

            const W = canvas.width;
            const H = canvas.height;
            const pad = 45; // Отступ под подписи осей

            ctx.clearRect(0, 0, W, H);

            // Координатная сетка
            ctx.strokeStyle = '#2c3e50';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = pad; x < W - pad; x += (W - 2 * pad) / 6) { ctx.moveTo(x, pad); ctx.lineTo(x, H - pad); }
            for (let y = pad; y < H - pad; y += (H - 2 * pad) / 4) { ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); }
            ctx.stroke();

            // Определение границ для Useti
            let uMin, uMax;
            if (chartScaleMode === 'fixed') {
                uMin = parseFloat(document.getElementById('useti-min').value);
                uMax = parseFloat(document.getElementById('useti-max').value);
            } else {
                uMin = chartHistory.useti.length ? Math.min(...chartHistory.useti) : -300;
                uMax = chartHistory.useti.length ? Math.max(...chartHistory.useti) : 300;
                if (uMin === uMax) { uMin -= 5; uMax += 5; }
            }

            // Определение границ для Iakb
            let iMin, iMax;
            if (chartScaleMode === 'fixed') {
                iMin = parseFloat(document.getElementById('iakb-min').value);
                iMax = parseFloat(document.getElementById('iakb-max').value);
            } else {
                iMin = chartHistory.iakb.length ? Math.min(...chartHistory.iakb) : -100;
                iMax = chartHistory.iakb.length ? Math.max(...chartHistory.iakb) : 100;
                if (iMin === iMax) { iMin -= 1; iMax += 1; }
            }

            // Рисование нулевой линии (если ноль внутри диапазона)
            drawZeroLine(ctx, uMin, uMax, W, H, pad, '#1e3a8a');
            drawZeroLine(ctx, iMin, iMax, W, H, pad, '#78350f');

            // Рисуем сигналы
            drawLine(ctx, chartHistory.useti, '#3498db', W, H, pad, uMin, uMax);
            drawLine(ctx, chartHistory.iakb, '#f1c40f', W, H, pad, iMin, iMax);

            // Подписи пределов осей
            ctx.font = '11px sans-serif';
            
            // Useti limits (Слева, синий)
            ctx.fillStyle = '#3498db';
            ctx.fillText((uMax >= 0 ? '+' : '') + uMax.toFixed(0) + 'V', 5, pad + 10);
            ctx.fillText((uMin >= 0 ? '+' : '') + uMin.toFixed(0) + 'V', 5, H - pad);

            // Iakb limits (Справа, желтый)
            ctx.fillStyle = '#f1c40f';
            ctx.fillText((iMax >= 0 ? '+' : '') + iMax.toFixed(0) + 'A', W - pad + 5, pad + 10);
            ctx.fillText((iMin >= 0 ? '+' : '') + iMin.toFixed(0) + 'A', W - pad + 5, H - pad);
        }

        function drawZeroLine(ctx, min, max, W, H, pad, color) {
            if (min < 0 && max > 0) {
                const normZero = (0 - min) / (max - min);
                const yZero = H - pad - normZero * (H - 2 * pad);
                
                ctx.save();
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(pad, yZero);
                ctx.lineTo(W - pad, yZero);
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawLine(ctx, data, color, W, H, pad, min, max) {
            if (data.length < 2) return;

            const stepX = (W - 2 * pad) / (maxChartPoints - 1);

            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();

            data.forEach((v, i) => {
                const x = pad + i * stepX;
                let normV = (v - min) / (max - min);
                if (normV < 0) normV = 0;
                if (normV > 1) normV = 1;

                const y = H - pad - normV * (H - 2 * pad);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });

            ctx.stroke();
        }

        // --- ЛОГИКА ЖУРНАЛА СОБЫТИЙ ---
        function renderLogTable(logs) {
            const tbody = document.getElementById('log-table-body');
            if (!logs || logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #8899a6;">Записи отсутствуют</td></tr>`;
                return;
            }

            const sevBadges = {
                0: '<span class="badge badge-info">INFO</span>',
                1: '<span class="badge badge-warn">WARN</span>',
                2: '<span class="badge badge-alarm">ALARM</span>'
            };

            tbody.innerHTML = logs.map(item => {
                const timeStr = formatTimestamp(item.time);
                const hexId = '0x' + item.id.toString(16).padStart(4, '0').toUpperCase();
                const sevHtml = sevBadges[item.sev] || `<span class="badge badge-info">${item.sev}</span>`;
                const valStr = (typeof item.val === 'number') ? item.val.toFixed(2) : item.val;

                return `
                    <tr>
                        <td>${timeStr}</td>
                        <td><code>${hexId}</code></td>
                        <td>${sevHtml}</td>
                        <td style="font-weight: bold; color: #f1c40f;">${valStr}</td>
                        <td>${item.param}</td>
                    </tr>
                `;
            }).join('');
        }

        function formatTimestamp(ms) {
            if (!ms) return '00:00:00';
            const sec = Math.floor(ms / 1000);
            const hrs = Math.floor(sec / 3600) % 24;
            const mins = Math.floor((sec % 3600) / 60);
            const secs = sec % 60;
            return `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
        }

        function changeLogPage(direction) {
            const newOffset = logOffset + (direction * LOG_LIMIT);
            if (newOffset >= 0 && newOffset < logTotalInRing) {
                logOffset = newOffset;
                triggerImmediateUpdate();
            }
        }

        function updateLogPaginationControls() {
            const currentPage = Math.floor(logOffset / LOG_LIMIT) + 1;
            const totalPages = Math.ceil(logTotalInRing / LOG_LIMIT) || 1;

            document.getElementById('log-page-info').innerText = `Стр. ${currentPage} из ${totalPages}`;
            document.getElementById('log-total-info').innerText = `Всего записей: ${logTotalInRing}`;

            document.getElementById('btn-log-prev').disabled = (logOffset <= 0);
            document.getElementById('btn-log-next').disabled = (logOffset + LOG_LIMIT >= logTotalInRing);
        }

        // --- ЛОГИКА ЗАПИСИ (EDIT / WRITE) ---
        function editParam(group, index, name) {
            if (currentDB !== 'params') return;

            const tabId = Object.keys(tabGroupMap).find(key => tabGroupMap[key] === group);
            const currentVal = document.getElementById(`${tabId}_${index}`).innerText;
            const newVal = prompt(`Изменить уставку [${name}]:`, currentVal);

            if (newVal !== null && !isNaN(parseFloat(newVal))) {
                sendWriteRequest(group, index, parseFloat(newVal));
            }
        }

        function toggleParamBit(group, bitIndex, name) {
            if (currentDB !== 'params') return;

            let currentMask = lastParamsMasks[group];
            let newMask = (currentMask ^ (1 << bitIndex)) >>> 0; 

            sendWriteRequest(group, bitIndex, newMask);
        }

        function sendWriteRequest(group, index, val) {
            fetch('/api/param_write', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ group: group, index: index, val: val })
            })
            .then(res => {
                if (!res.ok) throw new Error("Write failed");
                return res.json();
            })
            .then(data => {
                triggerImmediateUpdate();
            })
            .catch(err => alert("Ошибка записи параметра в STM32!"));
        }

        // Инициализация
        renderDOM();
        updateData();
    </script>
</body>
</html>
